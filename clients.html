<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Клиенты — SEO Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/app.js"></script>
  <script src="assets/modals.js"></script>
</head>
<body class="bg-canvas text-ink antialiased">
<div class="min-h-screen">

  <div data-app-chrome="clients" data-roles="owner,seo_head,mgr_head,pm,employee"></div>

  <div class="flex">

    <main class="flex-1 min-w-0 lg:pl-64 px-4 lg:px-8 py-6 space-y-6 pb-24 lg:pb-0">

      <header class="sticky top-0 z-30 min-h-[3.5rem] h-auto py-2.5 bg-canvas/80 backdrop-blur-xl border-b border-black/5 -mx-4 lg:-mx-8 -mt-6 px-4 lg:px-8 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <h1 class="text-base font-semibold tracking-tight text-ink leading-none truncate">Клиенты</h1>
        </div>
        <div class="flex items-center gap-2.5 shrink-0">
          <button type="button" data-can="create_client" data-open-modal="client-create" class="h-9 px-4 rounded-full bg-accent text-white text-xs font-medium hover:bg-accent-hover transition flex items-center justify-center shrink-0 shadow-sm">+ Новый клиент</button>
          <a href="calendar.html" aria-label="Уведомления" class="h-9 w-9 rounded-full text-zinc-600 hover:bg-black/5 flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg></a>
          <a href="settings.html" aria-label="Профиль" class="h-9 w-9 rounded-full bg-zinc-900 text-white text-[10px] font-semibold flex items-center justify-center shrink-0"><span data-user-initials>АС</span></a>
        </div>
      </header>

      <div class="w-full space-y-6">
        <div class="bg-white rounded-2xl shadow-card p-3 lg:p-3.5 flex flex-wrap xl:flex-nowrap items-center justify-between gap-3">
          <div data-client-scope class="inline-flex bg-zinc-100 rounded-full p-1 shrink-0" role="group" aria-label="Сотрудничество">
            <button type="button" data-coop="all" aria-pressed="true" class="px-3 py-1 rounded-full text-xs font-medium bg-white text-ink shadow-sm whitespace-nowrap">Все</button>
            <button type="button" data-coop="active" aria-pressed="false" class="px-3 py-1 rounded-full text-xs font-medium text-zinc-500 whitespace-nowrap">Активные</button>
            <button type="button" data-coop="paused" aria-pressed="false" class="px-3 py-1 rounded-full text-xs font-medium text-zinc-500 whitespace-nowrap">Приостановлены</button>
            <button type="button" data-coop="lead" aria-pressed="false" class="px-3 py-1 rounded-full text-xs font-medium text-zinc-500 whitespace-nowrap">Лиды</button>
          </div>
          <label class="relative block w-56 min-w-[12rem] ml-auto">
            <svg class="w-4 h-4 text-zinc-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z"/></svg>
            <input data-client-q type="search" placeholder="Поиск" aria-label="Поиск клиентов" class="h-8 w-full bg-zinc-50 border border-zinc-200/80 rounded-xl pl-8 pr-3 text-xs text-zinc-700 placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-accent">
          </label>
        </div>

        <section class="bg-white rounded-2xl shadow-card overflow-hidden">
          <div class="overflow-x-auto">
            <table data-sort-table class="w-full block md:table">
              <thead class="hidden md:table-header-group">
                <tr class="border-b border-zinc-100">
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3">Клиент</th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3">Сотрудничество</th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3">Контакт</th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3">Бриф</th>
                  <th class="text-right text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3">Проектов</th>
                </tr>
              </thead>
              <tbody data-client-rows class="divide-y divide-zinc-100 block md:table-row-group"></tbody>
            </table>
          </div>

          <div class="px-4 lg:px-6 py-4 border-t border-zinc-100 flex flex-wrap items-center justify-between gap-3">
            <div class="text-sm text-zinc-500">
              Показано <span data-clients-shown class="tabular-nums text-zinc-900 font-medium">1–5</span> из <span data-clients-total class="tabular-nums text-zinc-900 font-medium">5</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-zinc-500">
              <span>На странице</span>
              <select class="px-2.5 py-1 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
                <option>10</option>
                <option>20</option>
                <option>50</option>
                <option>Все</option>
              </select>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>

<script>
(function () {
  const App = window.SEOApp;
  const STATUS = {
    active: ['bg-emerald-50 text-emerald-700', 'bg-emerald-500', 'Активный'],
    paused: ['bg-zinc-100 text-zinc-600', 'bg-zinc-400', 'Приостановлен'],
    lead:   ['bg-violet-50 text-violet-700', 'bg-violet-500', 'Лид']
  };
  const PSTATUS = { active: ['bg-emerald-500', 'Активен'], launch: ['bg-blue-500', 'Запуск'], paused: ['bg-zinc-400', 'На паузе'] };
  /* brief: filled — заполнен, sent — отправлен (дата, напоминания), none — не отправлен */
  const CLIENTS = [
    { id: 'holod', name: 'ООО «Холод Групп»', status: 'active', since: 'с мая 2025', contact: 'Сергей Волков', phone: '+7 495 123-45-67', email: 's.volkov@holod.ru',
      brief: { state: 'filled', date: '03.05' },
      projects: [{ name: 'Интернет-магазин «Холод»', site: 'holod-shop.ru', status: 'active' }, { name: 'Оптовый портал «Холод B2B»', site: 'b2b.holod-shop.ru', status: 'launch' }] },
    { id: 'smirnov', name: 'ИП Смирнов А.', status: 'active', since: 'с марта 2025', contact: 'Андрей Смирнов', phone: '+7 916 555-12-34', email: 'a@remont-plus.ru',
      brief: { state: 'sent', date: '12.06' },
      projects: [{ name: 'Сайт услуг «Ремонт+»', site: 'remont-plus.ru', status: 'active' }] },
    { id: 'stroytech', name: 'АО «Стройтех»', status: 'paused', since: 'пауза с 01.06', contact: 'Михаил Орлов', phone: '+7 812 300-40-50', email: 'm.orlov@stroytech.ru',
      brief: { state: 'filled', date: '14.02' },
      projects: [{ name: 'B2B портал «Стройтех»', site: 'stroytech.ru', status: 'paused' }] },
    { id: 'medlife', name: 'ООО «МедЛайф»', status: 'active', since: 'с апреля 2025', contact: 'Елена Крылова', phone: '+7 383 200-10-20', email: 'e.krylova@medlife.ru',
      brief: { state: 'none' },
      projects: [{ name: 'Клиника «МедЛайф»', site: 'medlife-clinic.ru', status: 'active' }] },
    { id: 'alfa', name: 'ООО «Альфа»', status: 'lead', since: 'КП отправлено 10.06', contact: 'Дмитрий Лебедев', phone: '+7 343 222-33-44', email: 'd.lebedev@alfa-group.ru',
      brief: { state: 'sent', date: '16.06' },
      projects: [] }
  ];
  const TD = 'md:px-3 md:py-3 lg:py-4 min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden';
  const chip = (cls, dot, text) => '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ' + cls + '"><span class="w-1.5 h-1.5 rounded-full ' + dot + '"></span>' + text + '</span>';
  const LINK = 'text-xs font-medium text-accent hover:underline whitespace-nowrap disabled:text-zinc-400 disabled:no-underline';

  function brief(c) {
    const b = c.brief;
    if (b.state === 'filled') return '<div class="flex items-center gap-2">' + chip('bg-emerald-50 text-emerald-700', 'bg-emerald-500', 'Заполнен') + '<span class="text-xs text-zinc-500 tabular-nums">' + b.date + '</span></div>';
    if (b.state === 'sent') return '<div class="flex flex-wrap items-center gap-x-2 gap-y-1">' + chip('bg-amber-50 text-amber-700', 'bg-amber-500', 'Отправлен ' + b.date) +
      (b.reminded ? '<span class="text-xs text-zinc-500">напомнили ' + b.reminded + '</span>' : '') +
      '<button type="button" data-remind="' + c.id + '" data-can="create_client" class="' + LINK + '">Напомнить</button></div>';
    return '<div class="flex items-center gap-2">' + chip('bg-zinc-100 text-zinc-600', 'bg-zinc-400', 'Не отправлен') +
      '<button type="button" data-can="create_client" data-open-modal="brief-send" data-prefill-client="' + c.id + '" class="' + LINK + '">Отправить</button></div>';
  }
  function row(c) {
    const st = STATUS[c.status];
    const n = c.projects.length;
    return '<tr data-client="' + c.id + '" class="hover:bg-zinc-50/50 transition grid grid-cols-2 gap-x-4 gap-y-3 p-4 md:p-0 md:table-row align-top">' +
      '<td class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1"><div class="flex flex-wrap items-center gap-x-2 gap-y-1"><a href="client.html" class="text-sm font-semibold hover:underline">' + c.name + '</a>' + chip(st[0], st[1], st[2]) + '</div><div class="text-xs text-zinc-500 mt-0.5">' + c.contact + (c.phone ? ' · ' + c.phone : '') + '</div></td>' +
      '<td data-label="Сотрудничество" class="' + TD + '"><div class="text-sm text-zinc-700">' + c.since + '</div></td>' +
      '<td data-label="Контакт" class="' + TD + '"><div class="text-sm">' + c.contact + '</div><div class="text-xs text-zinc-500 mt-0.5">' + c.email + '</div></td>' +
      '<td data-label="Бриф" data-brief-cell="' + c.id + '" class="' + TD + '">' + brief(c) + '</td>' +
      '<td data-label="Проектов" class="md:px-4 lg:px-6 md:py-3 lg:py-4 md:text-right text-sm min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">' +
        (n ? '<button type="button" data-projects-toggle aria-expanded="false" class="inline-flex items-center gap-1 px-2 py-0.5 -mx-2 rounded-lg tabular-nums font-medium hover:bg-zinc-100 transition">' + n +
               '<svg class="w-3.5 h-3.5 text-zinc-400 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg></button>' +
             '<ul data-projects-list class="hidden mt-2 space-y-1.5 md:min-w-[240px] text-left">' + c.projects.map(p =>
               '<li><a href="project.html" class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-zinc-50 hover:bg-zinc-100 transition"><span title="' + PSTATUS[p.status][1] + '" class="w-1.5 h-1.5 rounded-full shrink-0 ' + PSTATUS[p.status][0] + '"></span>' +
               '<span class="min-w-0"><span class="block text-xs font-medium truncate">' + p.name + '</span><span class="block text-[11px] text-zinc-500 truncate">' + p.site + ' · ' + PSTATUS[p.status][1].toLowerCase() + '</span></span></a></li>').join('') + '</ul>'
           : '<span class="text-zinc-400 tabular-nums">0</span>') +
      '</td>' +
    '</tr>';
  }
  const tbody = document.querySelector('[data-client-rows]');
  let coop = 'all';
  const paint = () => {
    const q = (document.querySelector('[data-client-q]').value || '').trim().toLowerCase();
    const list = CLIENTS.filter(c => (coop === 'all' || c.status === coop) && (!q || (c.name + ' ' + c.contact + ' ' + c.email).toLowerCase().indexOf(q) !== -1));
    tbody.innerHTML = list.map(row).join('');
    document.querySelector('[data-clients-shown]').textContent = list.length ? '1–' + list.length : '0';
    document.querySelector('[data-clients-total]').textContent = CLIENTS.length;
    if (window.SEOApp) SEOApp.applyPermissions();
  };
  paint();
  document.querySelector('[data-client-scope]').addEventListener('click', e => {
    const b = e.target.closest('[data-coop]');
    if (!b) return;
    coop = b.dataset.coop;
    document.querySelectorAll('[data-client-scope] [data-coop]').forEach(btn => {
      const on = btn === b;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.classList.toggle('bg-white', on);
      btn.classList.toggle('text-ink', on);
      btn.classList.toggle('shadow-sm', on);
      btn.classList.toggle('text-zinc-500', !on);
    });
    paint();
  });
  document.querySelector('[data-client-q]').addEventListener('input', paint);

  tbody.addEventListener('click', e => {
    const t = e.target.closest('[data-projects-toggle]');
    if (t) {
      const list = t.parentElement.querySelector('[data-projects-list]');
      const open = list.classList.toggle('hidden') === false;
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      t.querySelector('svg').classList.toggle('rotate-180', open);
      return;
    }
    const r = e.target.closest('[data-remind]');
    if (r && !r.disabled) {
      const c = CLIENTS.find(x => x.id === r.dataset.remind);
      c.brief.reminded = '18.06';
      r.closest('[data-brief-cell]').innerHTML = brief(c);
      App.applyPermissions();
      App.toast('Напоминание отправлено: ссылка на бриф повторно ушла на ' + c.email, 'success');
    }
  });
  document.addEventListener('client:created', e => {
    const c = e.detail;
    CLIENTS.unshift({ id: c.id, name: c.name, status: 'lead', since: 'добавлен 18.06', contact: c.contact, phone: c.phone || '', email: c.email, brief: { state: 'none' }, projects: [] });
    paint();
    tbody.firstElementChild.classList.add('bg-accent/5');
    App.applyPermissions();
  });
  document.addEventListener('brief:sent', () => {
    const id = document.querySelector('#brief-send-modal [name="client"]').value;
    const c = CLIENTS.find(x => x.id === id);
    if (!c || c.brief.state === 'filled') return;
    c.brief = { state: 'sent', date: '18.06' };
    const cell = document.querySelector('[data-brief-cell="' + id + '"]');
    if (cell) cell.innerHTML = brief(c);
    App.applyPermissions();
  });
})();
</script>
</body>
</html>
