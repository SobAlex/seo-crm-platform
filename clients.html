<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Клиенты — SEO Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/app.js"></script>
</head>
<body class="bg-canvas text-ink antialiased">
<div class="min-h-screen">

  <div data-app-chrome="clients" data-roles="owner,seo_head,mgr_head,pm,employee"></div>

  <div class="flex">

    <main class="flex-1 min-w-0 lg:pl-64 pb-24 lg:pb-0">

      <div class="sticky top-0 z-30 bg-canvas/80 backdrop-blur-xl border-b border-black/5">
        <header class="px-4 lg:px-8 h-14 flex items-center justify-between gap-4">
          <h1 class="text-base font-semibold tracking-tight">Клиенты</h1>
          <a href="client-form.html" class="shrink-0 px-3.5 py-1.5 rounded-full bg-accent text-white text-sm font-medium hover:bg-accent-hover transition">Новый клиент</a>
        </header>
      </div>

      <div class="px-4 lg:px-8 py-6 lg:py-8 max-w-none">

        <section class="bg-white rounded-2xl shadow-card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full block md:table">
              <thead class="hidden md:table-header-group">
                <tr class="border-b border-zinc-100">
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3">Клиент</th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3">Контакт</th>
                  <th class="text-right text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3">Проектов</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-zinc-100 block md:table-row-group">
                <tr class="hover:bg-zinc-50/50 transition grid grid-cols-2 gap-x-4 gap-y-3 p-4 md:p-0 md:table-row">
                  <td class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1">
                    <a href="client.html" class="text-base font-medium hover:underline">ООО «Холод Групп»</a>
                  </td>
                  <td data-label="Контакт" class="md:px-3 md:py-3 lg:py-4 min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">
                    <div class="text-sm">Сергей Волков</div>
                    <div class="text-xs text-zinc-500 mt-0.5">s.volkov@holod.ru</div>
                  </td>
                  <td data-label="Проектов" class="md:px-4 lg:px-6 md:py-3 lg:py-4 md:text-right text-sm tabular-nums min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">1</td>
                </tr>
                <tr class="hover:bg-zinc-50/50 transition grid grid-cols-2 gap-x-4 gap-y-3 p-4 md:p-0 md:table-row">
                  <td class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1">
                    <a href="client.html" class="text-base font-medium hover:underline">ИП Смирнов А.</a>
                  </td>
                  <td data-label="Контакт" class="md:px-3 md:py-3 lg:py-4 min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">
                    <div class="text-sm">Андрей Смирнов</div>
                    <div class="text-xs text-zinc-500 mt-0.5">a@remont-plus.ru</div>
                  </td>
                  <td data-label="Проектов" class="md:px-4 lg:px-6 md:py-3 lg:py-4 md:text-right text-sm tabular-nums min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">1</td>
                </tr>
                <tr class="hover:bg-zinc-50/50 transition grid grid-cols-2 gap-x-4 gap-y-3 p-4 md:p-0 md:table-row">
                  <td class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1">
                    <a href="client.html" class="text-base font-medium hover:underline">АО «Стройтех»</a>
                  </td>
                  <td data-label="Контакт" class="md:px-3 md:py-3 lg:py-4 min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">
                    <div class="text-sm">Михаил Орлов</div>
                    <div class="text-xs text-zinc-500 mt-0.5">m.orlov@stroytech.ru</div>
                  </td>
                  <td data-label="Проектов" class="md:px-4 lg:px-6 md:py-3 lg:py-4 md:text-right text-sm tabular-nums min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">1</td>
                </tr>
                <tr class="hover:bg-zinc-50/50 transition grid grid-cols-2 gap-x-4 gap-y-3 p-4 md:p-0 md:table-row">
                  <td class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1">
                    <a href="client.html" class="text-base font-medium hover:underline">ООО «МедЛайф»</a>
                  </td>
                  <td data-label="Контакт" class="md:px-3 md:py-3 lg:py-4 min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">
                    <div class="text-sm">Елена Крылова</div>
                    <div class="text-xs text-zinc-500 mt-0.5">e.krylova@medlife.ru</div>
                  </td>
                  <td data-label="Проектов" class="md:px-4 lg:px-6 md:py-3 lg:py-4 md:text-right text-sm tabular-nums min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden">1</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="px-4 lg:px-6 py-4 border-t border-zinc-100 flex flex-wrap items-center justify-between gap-3">
            <div class="text-sm text-zinc-500">
              Показано <span class="tabular-nums text-zinc-900 font-medium">1–4</span> из <span class="tabular-nums text-zinc-900 font-medium">4</span>
            </div>
            <div class="flex items-center gap-2 text-sm text-zinc-500">
              <span>На странице</span>
              <select class="px-2.5 py-1 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
                <option>10</option>
                <option>20</option>
                <option>50</option>
                <option>Все</option>
              </select>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>

</body>
</html>
