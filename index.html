<!DOCTYPE html>
<html lang="ru" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Главная — SEO Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/app.js"></script>
  <script src="assets/modals.js"></script>
</head>
<body class="bg-canvas text-ink antialiased overflow-x-hidden">
<div class="min-h-screen overflow-x-hidden">

  <div data-app-chrome="index" data-roles="owner,seo_head,mgr_head,pm,employee"></div>

  <div class="flex">

    <main class="flex-1 min-w-0 lg:pl-64 px-4 lg:px-8 pt-6 pb-24 lg:pb-20 space-y-6">

      <header class="sticky top-0 z-30 min-h-[3.5rem] h-auto py-2.5 bg-canvas/80 backdrop-blur-xl border-b border-black/5 -mx-4 lg:-mx-8 -mt-6 px-4 lg:px-8 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <h1 class="text-base font-semibold tracking-tight text-ink leading-none truncate max-w-[140px] sm:max-w-none">Главная</h1>
        </div>
      </header>

      <div class="w-full space-y-6">
        <div class="bg-white rounded-2xl shadow-card w-full max-w-full overflow-hidden p-3 lg:p-3.5">
          <div data-queue-switch class="inline-flex bg-zinc-100 rounded-full p-1 max-w-full overflow-x-auto no-scrollbar shrink-0" role="group" aria-label="Фильтр приёмки">
            <button type="button" data-queue="all" class="px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition shrink-0">Все <span data-queue-count="all" class="ml-0.5 tabular-nums opacity-60">0</span></button>
            <button type="button" data-queue="mine" class="px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition shrink-0">Где я постановщик <span data-queue-count="mine" class="ml-0.5 tabular-nums opacity-60">0</span></button>
          </div>
        </div>
        <div>
          <h2 class="text-2xl lg:text-3xl font-semibold tracking-tight">Здравствуйте, <span data-user-name>Александр</span></h2>
          <p class="text-sm text-zinc-500 mt-1">Среда, 18 июня · <span data-role-name>Сотрудник</span></p>
        </div>
        <section data-home-feed data-task-region data-hide-empty data-can="accept_work" class="bg-white rounded-2xl shadow-card overflow-hidden">
          <div class="px-4 lg:px-6 py-4 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <h3 class="text-sm font-semibold tracking-tight flex items-center gap-2">На приёмке <span data-region-count class="px-1.5 py-0.5 rounded-full bg-zinc-100 text-zinc-600 text-xs font-medium tabular-nums">0</span></h3>
            </div>
            <a href="tasks.html?view=review" class="text-sm text-zinc-500 hover:text-zinc-900 transition shrink-0">Все →</a>
          </div>
          <div class="overflow-x-auto border-t border-zinc-100 -mx-4 sm:mx-0 px-4 sm:px-0 max-w-full">
            <table data-sortable data-setter-col class="w-full block md:table">
              <thead class="hidden md:table-header-group">
                <tr class="border-b border-zinc-100">
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3"><button type="button" data-sort="task" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Задача<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="project" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Проект<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="setter" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Постановщик<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="assignee" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Исполнитель<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="status" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Статус<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-right text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="due" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Срок<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-right text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3 lg:!pl-10 whitespace-nowrap"></th>
                </tr>
              </thead>
              <tbody data-task-group data-accept-queue class="divide-y divide-zinc-100 block md:table-row-group"></tbody>
            </table>
          </div>
          <div data-task-empty data-empty-filter="Задач, которые вы поставили, на приёмке нет" class="hidden px-4 lg:px-6 py-8 text-center text-sm text-zinc-500">Нет работ, ожидающих приёмки</div>
        </section>
        <section data-home-feed data-task-region class="bg-white rounded-2xl shadow-card overflow-hidden">
          <div class="px-4 lg:px-6 py-4 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <h3 class="text-sm font-semibold tracking-tight flex items-center gap-2">Требует внимания <span data-region-count class="px-1.5 py-0.5 rounded-full bg-zinc-100 text-zinc-600 text-xs font-medium tabular-nums">0</span></h3>
            </div>
            <a href="tasks.html?view=attention" class="text-sm text-zinc-500 hover:text-zinc-900 transition shrink-0">Все →</a>
          </div>
          <div class="overflow-x-auto border-t border-zinc-100 -mx-4 sm:mx-0 px-4 sm:px-0 max-w-full">
            <table data-sortable data-setter-col class="w-full block md:table">
              <thead class="hidden md:table-header-group">
                <tr class="border-b border-zinc-100">
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3"><button type="button" data-sort="task" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Задача<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="project" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Проект<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="setter" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Постановщик<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="assignee" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Исполнитель<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-left text-xs font-medium text-zinc-500 whitespace-nowrap px-3 py-3"><button type="button" data-sort="status" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Причина<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                  <th class="text-right text-xs font-medium text-zinc-500 whitespace-nowrap px-4 lg:px-6 py-3"><button type="button" data-sort="due" class="inline-flex items-center gap-1 hover:text-zinc-900 transition select-none">Срок<svg class="w-3 h-3 text-zinc-400" viewBox="0 0 16 16" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 3v10M5 6l3-3 3 3M5 10l3 3 3-3"/></svg></button></th>
                </tr>
              </thead>
              <tbody data-task-group class="divide-y divide-zinc-100 block md:table-row-group"></tbody>
            </table>
          </div>
          <div data-task-empty data-empty-exec="По вашим задачам ничего срочного" data-empty-set="Поставленные вами задачи идут по плану" data-empty-team="В ваших проектах всё спокойно" data-empty-all="В отделе всё спокойно" class="hidden px-4 lg:px-6 py-8 text-center text-sm text-zinc-500">Ничего срочного — отличная работа</div>
        </section>
      </div>

    </main>
  </div>
</div>
<script>
(function () {
  const App = window.SEOApp;
  const PEOPLE = {
    smirnov: ['А. Смирнов', 'АС'], sidorov: ['И. Сидоров', 'ИС'], vetrova: ['О. Ветрова', 'ОВ'], morozov: ['Н. Морозов', 'НМ'],
    petrov: ['А. Петров', 'АП'], dronov: ['И. Дронов', 'ИД'], lebedev: ['П. Лебедев', 'ПЛ'], kim: ['М. Ким', 'МК']
  };
  const PROJECTS = { holod: 'Холод', remont: 'Ремонт+', medlife: 'МедЛайф', stroytech: 'Стройтех' };
  /* На приёмке: творец (creator) — постановщик, acceptor — кто принимает */
  const QUEUE = [
    { id: 3,  title: 'Мета-теги категорий', project: 'remont', dir: 'Внутренняя', assignee: 'lebedev', creator: 'petrov', days: 3, due: '16.06' },
    { id: 1,  title: 'Проверить индексацию в GSC', project: 'holod', dir: 'Аудит', assignee: 'kim', creator: 'petrov', days: 2, due: '18.06', prio: true },
    { id: 2,  title: 'Canonical для фильтров', project: 'holod', dir: 'Аудит', assignee: 'petrov', creator: 'morozov', acceptor: 'sidorov', days: 1, due: '17.06' },
    { id: 21, title: 'Кластеризация раздела «Морозильники»', project: 'holod', dir: 'Семантика', assignee: 'kim', creator: 'smirnov', days: 1, due: '19.06' },
    { id: 22, title: 'Перелинковка статей блога', project: 'remont', dir: 'Внутренняя', assignee: 'lebedev', creator: 'smirnov', days: 2, due: '20.06' },
    { id: 23, title: 'Технический аудит после релиза', project: 'medlife', dir: 'Аудит', assignee: 'dronov', creator: 'smirnov', days: 4, due: '14.06', prio: true },
    { id: 24, title: 'Тексты для 5 страниц услуг', project: 'medlife', dir: 'Контент', assignee: 'lebedev', creator: 'vetrova', days: 1, due: '21.06' },
    { id: 25, title: 'Размещение ссылок: отчёт за неделю', project: 'stroytech', dir: 'Внешняя', assignee: 'dronov', creator: 'morozov', days: 2, due: '18.06' }
  ];
  /* Требует внимания: причина — overdue (красный), waiting / returned (янтарный) */
  const ATTENTION = [
    { id: 13, title: 'Настройка целей в Метрике', project: 'medlife', dir: 'Аудит', assignee: 'lebedev', creator: 'vetrova', acceptor: 'sidorov', reason: 'overdue', days: 9, due: '09.06', flags: 'overdue' },
    { id: 12, title: 'Оптимизация карточек услуг', project: 'remont', dir: 'Внутренняя', assignee: 'dronov', co: 'petrov', creator: 'morozov', acceptor: 'sidorov', reason: 'overdue', days: 8, due: '10.06', flags: 'overdue' },
    { id: 11, title: 'Дубли Title на пагинации', project: 'remont', dir: 'Аудит', assignee: 'petrov', co: 'dronov', creator: 'sidorov', acceptor: 'sidorov', reason: 'overdue', days: 6, due: '12.06', flags: 'overdue', prio: true },
    { id: 6,  title: 'Статья «Как выбрать холодильник»', project: 'holod', dir: 'Контент', assignee: 'kim', creator: 'petrov', acceptor: 'petrov', reason: 'returned', due: '20.06', flags: 'returned' },
    { id: 9,  title: 'Доступы к GSC и Метрике', project: 'holod', assignee: 'dronov', creator: 'morozov', acceptor: 'sidorov', reason: 'waiting', days: 6, flags: 'waiting' },
    { id: 10, title: 'Тексты категорий на согласование', project: 'holod', dir: 'Контент', assignee: 'kim', creator: 'petrov', acceptor: 'petrov', reason: 'waiting', days: 3, flags: 'waiting' },
    { title: 'Отчёт за май 2025', href: 'report.html', tag: 'Отчёт', project: 'medlife', assignee: 'dronov', reason: 'overdue', days: 13, due: '05.06', can: 'send_reports', noun: 'Просрочен' },
    { title: 'Переподключить Google Search Console', href: 'settings.html#integrations', tag: 'Авто', project: '', assignee: 'sidorov', reason: 'overdue', days: 3, due: '15.06', can: 'int_seo' }
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const TD = 'md:px-3 md:py-3 lg:py-4 text-sm min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden';
  const ROW = 'hover:bg-zinc-50/50 transition grid grid-cols-2 gap-x-4 gap-y-3 p-4 md:p-0 md:table-row';
  const days = n => n + ' ' + App.plural(n, ['день', 'дня', 'дней']);
  const REASON = {
    overdue:  t => '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-red-50 text-red-700 ring-1 ring-red-100 whitespace-nowrap shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>' + (t.noun || 'Просрочена') + ' на ' + days(t.days) + '</span>',
    waiting:  t => '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 ring-1 ring-amber-100 whitespace-nowrap shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Ждёт клиента</span><span class="text-xs text-zinc-500 tabular-nums">' + days(t.days) + '</span>',
    returned: () => '<span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 ring-1 ring-amber-100 whitespace-nowrap shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Возвращена на доработку</span>'
  };

  function cells(t) {
    const p = PEOPLE[t.assignee];
    const co = t.co ? PEOPLE[t.co] : null;
    return '<td class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1"><div class="flex flex-wrap items-center gap-x-2 gap-y-1">' +
        '<a href="' + (t.href || 'task.html') + '" class="text-base md:text-sm font-medium hover:underline">' + esc(t.title) + '</a>' +
        (t.prio ? '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-red-50 text-red-700">Высокий</span>' : '') +
        (t.tag ? '<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-zinc-100 text-zinc-600">' + t.tag + '</span>' : '') +
        '<span data-co-tag class="hidden inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-medium bg-blue-50 text-blue-700">соисполнитель</span>' +
      '</div></td>' +
      '<td data-label="Проект" class="' + TD + '">' + (t.project
        ? '<a href="tasks.html?project=' + t.project + '" class="text-sm hover:underline">' + PROJECTS[t.project] + '</a>' + (t.dir ? '<div class="text-xs text-zinc-500 mt-0.5">' + t.dir + '</div>' : '')
        : '<span class="text-zinc-500">Вся компания</span>') + '</td>' +
      '<td data-label="Исполнитель" class="' + TD + '"><a href="tasks.html?executor=' + t.assignee + '" class="flex items-center gap-2 hover:underline"><span class="flex -space-x-2">' +
        '<span class="w-7 h-7 rounded-full bg-zinc-900 text-white text-[10px] font-semibold flex items-center justify-center shrink-0 ring-2 ring-white">' + p[1] + '</span>' +
        (co ? '<span title="Соисполнитель: ' + co[0] + '" class="w-7 h-7 rounded-full bg-zinc-200 text-zinc-700 text-[10px] font-semibold flex items-center justify-center shrink-0 ring-2 ring-white">' + co[1] + '</span>' : '') +
        '</span><span class="text-sm whitespace-nowrap">' + p[0] + '</span>' + (co ? '<span class="text-xs text-zinc-500 tabular-nums">+1</span>' : '') + '</a></td>';
  }
  const attrs = (t, extra) => 'data-task' + (t.id ? ' data-id="' + t.id + '"' : '') + ' data-project="' + t.project + '" data-assignee="' + t.assignee + '" data-co="' + (t.co || '') +
    '" data-creator="' + (t.creator || '') + '" data-acceptor="' + (t.acceptor || t.creator || '') + '" data-flags="' + extra + '"' + (t.can ? ' data-can="' + t.can + '"' : '') + ' class="' + ROW + '"';

  document.querySelector('[data-accept-queue]').innerHTML = QUEUE.map(t =>
    '<tr ' + attrs(t, 'review') + ' data-status="review" data-title="' + esc(t.title) + '">' + cells(t) +
      '<td data-label="Статус" class="' + TD + '"><div class="flex flex-wrap items-center gap-x-2 gap-y-1"><span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700 whitespace-nowrap shrink-0"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>На проверке</span><span class="text-xs text-zinc-500 tabular-nums">' + t.days + ' дн.</span></div></td>' +
      '<td data-label="Срок" class="' + TD + ' md:text-right whitespace-nowrap tabular-nums text-zinc-500">' + t.due + '</td>' +
      '<td data-label="" class="md:px-4 lg:px-6 md:py-3 lg:py-4 col-span-2 md:col-span-1 md:text-right"><div class="flex gap-2 md:justify-end">' +
        '<button type="button" data-resolve="Принято: «' + esc(t.title) + '»" title="Принять" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-600 text-white text-xs font-medium hover:bg-emerald-700 active:scale-[.97] transition whitespace-nowrap shrink-0"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>Принять</button>' +
        '<button type="button" data-rework class="px-2.5 py-1 rounded-full bg-amber-500 text-white text-xs font-medium hover:bg-amber-600 active:scale-[.97] transition whitespace-nowrap shrink-0">На доработку</button>' +
      '</div></td>' +
    '</tr>').join('');

  document.querySelector('[data-task-region]:not([data-hide-empty]) [data-task-group]').innerHTML = ATTENTION.map(t =>
    '<tr ' + attrs(t, t.flags ? t.flags + ' attention' : 'attention') + '>' + cells(t) +
      '<td data-label="Причина" data-sort-col="status" class="' + TD + '"><div class="flex flex-wrap items-center gap-x-2 gap-y-1">' + REASON[t.reason](t) + '</div></td>' +
      '<td data-label="Срок" class="md:px-4 lg:px-6 md:py-3 lg:py-4 text-sm min-w-0 before:block before:text-[11px] before:text-zinc-500 before:mb-0.5 before:content-[attr(data-label)] md:before:hidden md:text-right whitespace-nowrap tabular-nums ' + (t.reason === 'overdue' ? 'text-red-600 font-medium' : 'text-zinc-500') + '">' + (t.due || '—') + '</td>' +
    '</tr>').join('');

  /* Фильтр приёмки «Все / Где я постановщик» */
  let mode = 'all';
  const queue = document.querySelector('[data-accept-queue]');
  const mineFilter = el => !el.closest('[data-accept-queue]') || el.dataset.creator === App.me;
  function recount() {
    App.setTaskFilter(null);
    const rows = Array.from(queue.querySelectorAll(':scope > [data-task]')).filter(r => r.dataset.match === '1');
    document.querySelector('[data-queue-count="all"]').textContent = rows.length;
    document.querySelector('[data-queue-count="mine"]').textContent = rows.filter(r => r.dataset.creator === App.me).length;
    App.setTaskFilter(mode === 'mine' ? mineFilter : null);
    document.querySelectorAll('[data-queue]').forEach(b => {
      const on = b.dataset.queue === mode;
      ['bg-white', 'text-ink', 'shadow-sm'].forEach(c => b.classList.toggle(c, on));
      b.classList.toggle('text-zinc-500', !on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  document.querySelector('[data-queue-switch]').addEventListener('click', e => {
    const b = e.target.closest('[data-queue]');
    if (!b) return;
    mode = b.dataset.queue;
    recount();
  });
  queue.addEventListener('click', e => {
    if (e.target.closest('[data-resolve]')) return setTimeout(recount);
    const btn = e.target.closest('[data-rework]');
    if (!btn) return;
    const row = btn.closest('[data-task]');
    const who = PEOPLE[row.dataset.assignee][0];
    App.askReason(btn, {
      title: 'Вернуть на доработку',
      sub: row.dataset.title + ' · ' + who,
      placeholder: 'Обязательно опишите, что исправить — исполнитель увидит это в задаче',
      ok: 'Вернуть'
    }).then(reason => {
      if (!reason || !String(reason).trim()) return;
      row.remove();
      recount();
      App.toast('«' + row.dataset.title + '» отправлена на доработку · ' + who + ' получит замечание', 'warning');
    });
  });
  document.addEventListener('seo:ready', recount);
})();
</script>
</body>
</html>
