<!DOCTYPE html>
<html lang="ru" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Составить бриф — SEO Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/app.js"></script>
  <script src="assets/modals.js"></script>
</head>
<body class="bg-canvas text-ink antialiased overflow-x-hidden">
<div class="min-h-screen overflow-x-hidden">

  <div data-app-chrome="projects" data-roles="owner,seo_head,mgr_head,pm,employee"></div>

  <div class="flex">

    <main class="flex-1 min-w-0 lg:pl-64 px-4 lg:px-8 pt-6 pb-24 lg:pb-20 space-y-6">

      <header class="sticky top-0 z-30 min-h-[3.5rem] h-auto py-2.5 bg-canvas/80 backdrop-blur-xl border-b border-black/5 -mx-4 lg:-mx-8 -mt-6 px-4 lg:px-8 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <a href="project.html" class="text-sm text-zinc-500 hover:text-zinc-900 transition shrink-0">← Проект «Холод»</a>
          <h1 class="text-base font-semibold tracking-tight text-ink leading-none truncate max-w-[140px] sm:max-w-none">Бриф для клиента</h1>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
          <button type="submit" form="brief-form" data-toast="Бриф сохранён" class="h-9 px-4 inline-flex items-center justify-center rounded-full bg-accent text-white text-xs font-medium hover:bg-accent-hover transition">Сохранить</button>
          <a href="calendar.html" aria-label="Уведомления" class="h-9 w-9 rounded-full text-zinc-600 hover:bg-black/5 flex items-center justify-center shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg></a>
          <a href="profile.html" aria-label="Мой профиль" class="h-9 w-9 rounded-full bg-zinc-900 text-white text-[10px] font-semibold flex items-center justify-center shrink-0"><span data-user-initials>АС</span></a>
        </div>
      </header>

      <div class="max-w-4xl mx-auto space-y-6">

        <div>
          <h2 class="text-2xl lg:text-3xl font-semibold tracking-tight">Бриф для клиента</h2>
        </div>

        <form id="brief-form" class="flex flex-col gap-4 lg:gap-6" onsubmit="return false">

          <section class="bg-white rounded-2xl shadow-card p-6 space-y-4">
            <h3 class="text-sm font-semibold tracking-tight mb-5">Вопрос 1</h3>
            <label class="block text-xs font-medium text-zinc-500 mb-2" for="q1">Формулировка</label>
            <input id="q1" type="text" value="Какая главная цель на ближайшие 3 месяца?" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
            <p class="text-xs text-zinc-500 mt-3 mb-2">Варианты ответа</p>
            <div class="space-y-2">
              <input type="text" value="Рост органического трафика" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
              <input type="text" value="Заявки из поиска" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
              <input type="text" value="Выход в топ по категориям" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
            </div>
          </section>

          <section class="bg-white rounded-2xl shadow-card p-6 space-y-4">
            <h3 class="text-sm font-semibold tracking-tight mb-5">Вопрос 2</h3>
            <label class="block text-xs font-medium text-zinc-500 mb-2" for="q2">Формулировка</label>
            <input id="q2" type="text" value="Какие доступы уже есть у команды?" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
            <p class="text-xs text-zinc-500 mt-3 mb-2">Варианты ответа, можно выбрать несколько</p>
            <div class="space-y-2">
              <input type="text" value="Яндекс Метрика" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
              <input type="text" value="Google Search Console" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
              <input type="text" value="Админка сайта" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
            </div>
          </section>

          <section class="bg-white rounded-2xl shadow-card p-6 space-y-4">
            <h3 class="text-sm font-semibold tracking-tight mb-5">Вопрос 3</h3>
            <label class="block text-xs font-medium text-zinc-500 mb-2" for="q3">Формулировка</label>
            <input id="q3" type="text" value="Что важно учесть по ассортименту и сезонности?" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
            <p class="text-xs text-zinc-500 mt-3">Клиент ответит свободным текстом.</p>
          </section>

          <button type="button" data-toast="Новый вопрос добавится в редакторе брифа" class="w-full px-4 py-3 rounded-2xl border border-dashed border-zinc-300 text-sm text-zinc-500 hover:text-zinc-900 hover:border-zinc-400 transition">+ Добавить вопрос</button>

          <div class="flex flex-col sm:flex-row gap-2 sm:justify-end">
            <a href="project.html" class="px-5 py-2.5 rounded-full bg-white border border-zinc-200 text-sm font-medium hover:bg-zinc-50 transition text-center">Отмена</a>
            <button type="submit" data-toast="Бриф сохранён" class="px-5 py-2.5 rounded-full bg-accent text-white text-sm font-medium hover:bg-accent-hover transition">Сохранить</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
</body>
</html>
