<!DOCTYPE html>
<html lang="ru" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бриф — SEO Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/app.js"></script>
  <script src="assets/modals.js"></script>
</head>
<body class="bg-canvas text-ink antialiased overflow-x-hidden">
<div class="min-h-screen overflow-x-hidden">

  <div data-app-chrome="brief" data-roles="owner,seo_head,mgr_head,pm,employee,client"></div>

  <div class="flex">

    <main class="flex-1 min-w-0 lg:pl-64 px-4 lg:px-8 pt-6 pb-24 lg:pb-20 space-y-6">

      <header class="sticky top-0 z-30 min-h-[3.5rem] h-auto py-2.5 bg-canvas/80 backdrop-blur-xl border-b border-black/5 -mx-4 lg:-mx-8 -mt-6 px-4 lg:px-8 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <a data-brief-back href="portal.html" class="text-sm text-zinc-500 hover:text-zinc-900 transition shrink-0">← Мой проект</a>
          <h1 class="text-base font-semibold tracking-tight text-ink leading-none truncate max-w-[140px] sm:max-w-none">Бриф</h1>
        </div>
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
          <button type="submit" form="brief-form" data-brief-submit class="h-9 px-4 inline-flex items-center justify-center rounded-full bg-accent text-white text-xs font-medium hover:bg-accent-hover transition">Отправить бриф</button>
        </div>
      </header>

      <div class="max-w-4xl mx-auto space-y-6">

        <div>
          <h2 class="text-2xl lg:text-3xl font-semibold tracking-tight">Бриф проекта</h2>
          <p class="text-sm text-zinc-500 mt-1">Интернет-магазин «Холод» · ответы нужны команде, чтобы начать работу</p>
        </div>

        <form id="brief-form" class="flex flex-col gap-4 lg:gap-6" onsubmit="return false">

          <section class="bg-white rounded-2xl shadow-card p-6 space-y-4">
            <h3 class="text-sm font-semibold tracking-tight">1. Какая главная цель на ближайшие 3 месяца?</h3>
            <div class="space-y-2" role="radiogroup" aria-label="Главная цель">
              <label class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-zinc-200 hover:bg-zinc-50 cursor-pointer transition">
                <input type="radio" name="goal" value="traffic" class="accent-[var(--accent,#0071e3)]" checked>
                <span class="text-sm text-zinc-800">Рост органического трафика</span>
              </label>
              <label class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-zinc-200 hover:bg-zinc-50 cursor-pointer transition">
                <input type="radio" name="goal" value="leads" class="accent-[var(--accent,#0071e3)]">
                <span class="text-sm text-zinc-800">Заявки из поиска</span>
              </label>
              <label class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-zinc-200 hover:bg-zinc-50 cursor-pointer transition">
                <input type="radio" name="goal" value="top" class="accent-[var(--accent,#0071e3)]">
                <span class="text-sm text-zinc-800">Выход в топ по категориям</span>
              </label>
            </div>
          </section>

          <section class="bg-white rounded-2xl shadow-card p-6 space-y-4">
            <h3 class="text-sm font-semibold tracking-tight">2. Какие доступы уже есть у команды?</h3>
            <p class="text-xs text-zinc-500">Можно выбрать несколько</p>
            <div class="space-y-2">
              <label class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-zinc-200 hover:bg-zinc-50 cursor-pointer transition">
                <input type="checkbox" name="access" value="metrica" class="accent-[var(--accent,#0071e3)]" checked>
                <span class="text-sm text-zinc-800">Яндекс Метрика</span>
              </label>
              <label class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-zinc-200 hover:bg-zinc-50 cursor-pointer transition">
                <input type="checkbox" name="access" value="gsc" class="accent-[var(--accent,#0071e3)]">
                <span class="text-sm text-zinc-800">Google Search Console</span>
              </label>
              <label class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl border border-zinc-200 hover:bg-zinc-50 cursor-pointer transition">
                <input type="checkbox" name="access" value="cms" class="accent-[var(--accent,#0071e3)]" checked>
                <span class="text-sm text-zinc-800">Админка сайта</span>
              </label>
            </div>
          </section>

          <section class="bg-white rounded-2xl shadow-card p-6 space-y-4">
            <h3 class="text-sm font-semibold tracking-tight">3. Что важно учесть по ассортименту и сезонности?</h3>
            <label class="block text-xs font-medium text-zinc-500 mb-2" for="season">Ваш комментарий</label>
            <textarea id="season" name="season" rows="4" placeholder="Например: пик продаж, приоритетные категории, ограничения" class="w-full px-3.5 py-2 rounded-xl border border-zinc-200 bg-white text-sm resize-y focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">Пик продаж холодильного оборудования приходится на май–июль. Важно сделать упор на категорию промышленных чиллеров и морозильных ларей к началу сезона.</textarea>
          </section>

          <div class="flex flex-col sm:flex-row gap-2 sm:justify-end">
            <a data-brief-cancel href="portal.html" class="h-9 px-4 rounded-full bg-white border border-zinc-200 text-xs font-medium hover:bg-zinc-50 transition text-center inline-flex items-center justify-center">Отмена</a>
            <button type="submit" data-brief-submit class="h-9 px-4 rounded-full bg-accent text-white text-xs font-medium hover:bg-accent-hover transition">Отправить бриф</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>
<script>
(function () {
  const App = window.SEOApp;
  const isClient = App && App.role === 'client';

  document.querySelectorAll('[data-brief-back], [data-brief-cancel]').forEach(el => {
    if (isClient) {
      el.href = 'portal.html';
      if (el.hasAttribute('data-brief-back')) el.textContent = '← Мой проект';
    } else {
      el.href = 'project.html';
      if (el.hasAttribute('data-brief-back')) el.textContent = '← Проект «Холод»';
    }
  });

  function submitBrief(e) {
    if (e) e.preventDefault();
    if (App && App.toast) {
      App.toast('Бриф успешно отправлен в команду агентства', 'success');
    }
    setTimeout(() => { location.href = isClient ? 'portal.html' : 'project.html'; }, 700);
  }

  const form = document.getElementById('brief-form');
  if (form) form.addEventListener('submit', submitBrief);
  document.querySelectorAll('[data-brief-submit]').forEach(btn => {
    btn.addEventListener('click', submitBrief);
  });
})();
</script>
</body>
</html>
