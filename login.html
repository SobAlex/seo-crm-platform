<!DOCTYPE html>
<html lang="ru" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — SEO Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', '"Segoe UI"', 'sans-serif'] },
          colors: { canvas: '#f5f5f7', ink: '#1d1d1f', accent: { DEFAULT: '#0071e3', hover: '#0077ed' } },
          borderRadius: { xl: '0.875rem', '2xl': '1.25rem', '3xl': '1.75rem' },
          boxShadow: {
            card: '0 1px 2px rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.04)',
            pop: '0 24px 64px rgba(0,0,0,.18)'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-canvas text-ink antialiased overflow-x-hidden">
  <div class="bg-canvas min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm mx-auto">
      <div class="bg-white rounded-3xl shadow-card p-6 sm:p-8">
        <div class="flex flex-col items-center text-center mb-6">
          <span class="w-12 h-12 rounded-2xl bg-zinc-900 text-white text-lg font-semibold flex items-center justify-center shadow-sm">S</span>
          <div class="mt-3 text-sm font-semibold tracking-tight">SEO Control</div>
          <h1 class="mt-4 text-xl font-semibold tracking-tight text-ink">Вход в кабинет</h1>
          <p class="mt-1 text-sm text-zinc-500">Система управления проектами агентства</p>
        </div>

        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label for="login-email" class="block text-xs font-medium text-zinc-500 mb-2">Email</label>
            <input id="login-email" name="email" type="email" required autocomplete="username" placeholder="name@agency.ru" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
          </div>
          <div>
            <label for="login-password" class="block text-xs font-medium text-zinc-500 mb-2">Пароль</label>
            <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-200 bg-white text-sm focus:outline-none focus:ring-4 focus:ring-accent/15 focus:border-accent/40">
          </div>
          <div class="flex items-center justify-between gap-3">
            <label class="flex items-center gap-2 text-sm text-zinc-600 cursor-pointer select-none">
              <input type="checkbox" name="remember" class="w-4 h-4 rounded border-zinc-300 accent-accent">
              <span>Запомнить меня</span>
            </label>
            <a href="#" class="text-sm text-accent hover:underline shrink-0">Забыли пароль?</a>
          </div>
          <button type="submit" class="h-10 w-full rounded-full bg-accent text-white text-sm font-medium hover:bg-accent-hover transition shadow-sm">Войти</button>
        </form>
      </div>

      <p class="mt-5 text-center">
        <a href="landing.html" class="text-sm text-zinc-500 hover:text-zinc-900 transition">← На главную лендинга</a>
      </p>
    </div>
  </div>

  <script>
  document.getElementById('login-form').addEventListener('submit', e => {
    e.preventDefault();
    const form = e.currentTarget;
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    location.href = 'index.html';
  });
  </script>
</body>
</html>
